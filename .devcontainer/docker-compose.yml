version: "3.8"
services:
  ai-engine-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached # ワークスペース全体をマウント（必要に応じて調整）
      - ~/.claude:/root/.claude:cached # ホスト側のClaude設定(CLAUDE.md等)を共有
    # VS Code が DevContainer として認識し続けるための設定
    command: /bin/bash -c "while sleep 1000; do :; done"

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 5g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    working_dir: /workspaces/apps/backend/ai-engine
