version: "3.8"
services:
  ai-engine-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../apps/backend:/workspaces:cached # apps/backend配下(ai-engine/api/proto)のみマウント。protoはC++/Rust共通契約のためai-engine単体ではなくbackend単位で共有する
      - ~/.claude:/root/.claude:cached # ホスト側のClaude設定(CLAUDE.md等)を共有
      - ccache-data:/ccache # ccache のキャッシュをコンテナ再作成後も永続化
    # VS Code が DevContainer として認識し続けるための設定
    command: /bin/bash -c "while sleep 1000; do :; done"

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 5g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    working_dir: /workspaces/ai-engine
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.rust
    volumes:
      - ../apps/backend:/workspaces:cached
      - ~/.claude:/root/.claude:cached # ホスト側のClaude設定(CLAUDE.md等)を共有
      - cargo-registry:/usr/local/cargo/registry # cargo のキャッシュをコンテナ再作成後も永続化
    working_dir: /workspaces/api

volumes:
  ccache-data:
  cargo-registry:
