name: dl-node-editor
services:
  ai-engine:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.ai-engine
      target: runtime
    volumes:
      - ./data/weights:/app/models #.pt保存先
      - ./data/datasets:/datasets:ro #読み取り専用(:ro)
    environment:
      - AI_ENGINE_LOAD_IMAGE_THREADS=${AI_ENGINE_IMAGE_LOAD_THREADS:-4} #AI_ENGINE_CPUSの半分(お好みで)
    deploy:
      resources:
        limits:
          cpus: "${AI_ENGINE_CPUS:-8}"
          memory: "${AI_ENGINE_MEMORY_LIMIT:-10g}"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.api
      target: runtime
    volumes:
      - ./data/api-data:/data
      - ./data/datasets:/datasets
    environment:
      - DATABASE_URL=sqlite:/data/training.db?mode=rwc #data/training.dbがない場合読み書き可で作成
      - AI_ENGINE_ADDR=http://ai-engine:50051
      - DATASET_UPLOAD_MAX_MIB=${DATASET_UPLOAD_MAX_MIB:?.deploy/.envに設定してください}
      - DATASET_UNZIP_MAX_MIB=${DATASET_UNZIP_MAX_MIB:?.deploy/.envに設定してください}
    depends_on:
      - ai-engine
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.web
      target: runtime
    ports:
      - "25812:80"
    depends_on:
      - api
    restart: unless-stopped