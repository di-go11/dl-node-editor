server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_buffering off; # 受け取りながらAPIへ流す
        proxy_read_timeout 1h;
    }

    location /api/v1/datasets {
        proxy_pass http://api:8080;
        proxy_read_timeout 1h;
        client_max_body_size 0; # nginxでは制限しない
        proxy_request_buffering off; #受け取りながら apiへ流す
    }

}