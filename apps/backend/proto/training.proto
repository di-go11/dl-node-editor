syntax = "proto3";
package training.v1;

service TrainingService {
    rpc StartTraining(StartTrainingRequest) returns (StartTrainingResponse); // 単項
    rpc StreamProgress(StreamProgressRequest) returns (stream StreamProgressResponse); // サーバーストリーミング
    rpc StopTraining(StopTrainingRequest) returns (StopTrainingResponse); //単項
}

// ---StartTrainingRequest---

// ---layers---

message Conv2DParams {
    int64 in_channels = 1;
    int64 out_channels = 2;
    int64 kernel_size = 3;
    int64 stride = 4;
    int64 padding = 5;
    int64 dilation = 6;
}

message Pooling2DParams {
    PoolingType pooling_type = 1;
    int64 kernel_size = 2;
    int64 stride = 3;
    int64 padding = 4;
}

enum PoolingType {POOLING_TYPE_UNSPECIFIED = 0; POOLING_TYPE_MAX = 1; POOLING_TYPE_AVERAGE = 2;}

message BatchNormParams {int64 num_features = 1; double eps = 2; double momentum = 3;}
message LinearParams {int64 in_features = 1;int64 out_features = 2; bool bias = 3;}
message ActivationParams {ActivationType activation_type = 1; int32 dim = 2;}

enum ActivationType {
    ACTIVATION_TYPE_UNSPECIFIED = 0;
    ACTIVATION_TYPE_RELU = 1;
    ACTIVATION_TYPE_SIGMOID = 2;
    ACTIVATION_TYPE_SOFTMAX = 3;
    ACTIVATION_TYPE_TANH = 4;
}
message IndexedPoolingParams {int64 kernel_size = 1; int64 stride = 2; int64 padding = 3;}
message UnpoolingParams {int64 kernel_size = 1; int64 stride = 2; int64 padding = 3;}

message LayerConfig {
    oneof params {
        Conv2DParams conv2d = 1;
        Pooling2DParams pooling2d = 2;
        BatchNormParams batch_norm = 3;
        LinearParams linear = 4;
        ActivationParams activation = 5;
        IndexedPoolingParams indexed_pooling = 6;
        UnpoolingParams unpooling = 7;
    }
}

message ModelGraph {
    repeated LayerConfig layers = 1;
}

// ---optimizer---

message AdamConfig  { double learning_rate = 1; double weight_decay = 2; double beta1 = 3; double beta2 = 4; double eps = 5; }
message AdamWConfig { double learning_rate = 1; double weight_decay = 2; double beta1 = 3; double beta2 = 4; }
message SGDConfig   { double learning_rate = 1; double weight_decay = 2; double momentum = 3; bool nesterov = 4; }

message OptimizerConfig {
    oneof config {
        AdamConfig adam = 1;
        AdamWConfig adam_w = 2;
        SGDConfig sgd = 3;
    }
}

// ---loss---

message CrossEntropyConfig {}
message MseLossConfig {}
message DiceLossConfig {}
message FocalLossConfig { double gamma = 1; double alpha = 2; }
message ComboLossConfig { double alpha = 1; } // Cross Entropy 項の重み。(1-alpha) が Dice 項の重み。送る側が必ず値を埋める(未設定だと 0.0 になる)
message BoundaryLossConfig {}

// 並び順は C++ の LossConfig(std::variant)/ LossType と対応させる。
// numClasses / ignoreIndex はデータセット由来の値なのでここには持たない。
message LossConfig {
    oneof config {
        CrossEntropyConfig cross_entropy = 1;
        MseLossConfig mse = 2;
        DiceLossConfig dice = 3;
        FocalLossConfig focal = 4;
        ComboLossConfig combo = 5;
        BoundaryLossConfig boundary = 6;
    }
}

// ---Data---

message PascalVocConfig { bool include_difficult = 1; }
message ImageAnnotationConfig { oneof config { PascalVocConfig pascal_voc = 1; } }

message SegmentationSpec    { uint32 ignore_index = 1; } //必ず設定する、0〜255、既定値は 255
message ObjectDetectionSpec {}
message ClassificationSpec  {}
message ImageTaskSpecs {
    oneof spec {
        SegmentationSpec segmentation = 1;
        ObjectDetectionSpec object_detection = 2;
        ClassificationSpec classification = 3;
    }
}

message ImageSpec {
    ImageAnnotationConfig annotation = 1;
    uint32 input_width = 2; // 1以上.既定値256
    uint32 input_height = 3; // 1以上.既定値256
    ImageTaskSpecs task_specs = 4;
}

message DataSpec { oneof spec { ImageSpec image = 1; } } //データのvariant

// 再現性のための乱数シード。0 も有効な値なので、uint64 を直接持たずメッセージで包んで「未指定」と区別する
// (proto3 の optional はシステムの protoc 3.12 では実験フラグが必要なため使わない)。
message Seed { uint64 value = 1; }

// ---merge---

message StartTrainingRequest {
    string model_name = 1;
    ModelGraph model_graph = 2;
    OptimizerConfig optimizer = 3;
    LossConfig loss = 4;
    uint32 epoch = 5;
    uint32 batch = 6;
    string dataset_path = 7;
    string device = 8;
    DataSpec data_spec = 9;
    uint32 save_last_every = 10; // 0=毎エポック
    string resume_from = 11; // 空なら再開しない
    Seed seed = 12; // 未設定(has_seed = false)なら乱数を固定しない
}

message StartTrainingResponse {
    string job_id = 1;
    TrainingStatus status = 2;
}

message StopTrainingRequest {string job_id = 1;}
message StopTrainingResponse {
    TrainingStatus status = 1;
}

// ---StreamProgress---

message StreamProgressRequest {string job_id = 1;}

message StreamProgressResponse{
    uint32 epoch = 1; // 終了したエポック数
    double train_loss = 2; // 学習時の損失
    double val_loss = 3; // バリデーション時の損失
    TrainingStatus status = 4; // IDLE / RUNNING / COMPLETED /FAILED / STOPPED
    oneof metrics{
        SegmentationMetrics segmentation = 5; // セグメンテーション時のメトリクス(mioU,pixel_acc, fw_iou, mean_class_accuracy, per_class_iou)
        ClassificationMetrics classification = 9; // クラス分類時のメトリクス(accuracy, macro_f1, per_class_accuracy)
    }
    uint64 epoch_elapsed_ms = 6; // 処理済みエポックにかかった時間
    uint64 total_elapsed_ms = 7; // 累計処理時間
    string error_message = 8; // status が FAILED のときの原因
}

message SegmentationMetrics{
    double pixel_acc = 1;
    double miou = 2;
    double fw_iou = 3;
    double mean_class_accuracy = 4;
    repeated double per_class_iou = 5;
}

message ClassificationMetrics{
    double accuracy = 1;
    double macro_f1 = 2;
    repeated double per_class_accuracy = 3;
}

enum TrainingStatus {
    TRAINING_STATUS_UNSPECIFIED = 0;
    TRAINING_STATUS_RUNNING = 1;
    TRAINING_STATUS_COMPLETED = 2;
    TRAINING_STATUS_FAILED = 3;
    TRAINING_STATUS_STOPPED = 4;
    TRAINING_STATUS_IDLE = 5;
}