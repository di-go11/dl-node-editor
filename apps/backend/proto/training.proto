syntax = "proto3";
package training.v1;

import "model_graph.proto";

// FAILED_PRECONDITION の理由は、トレーラーのメタデータ error-reason で区別する(StartTraining / ValidateModelGraph):
//   resume_precondition  … 再開の条件を満たさない(checkpoint がない・読めない、指定のエポック数まで学習済み)
//   model_graph_mismatch … モデルのグラフがこのデータセットでは学習できない(構造・形・出力チャンネル数 ≠ クラス数)。
//                          メッセージに、問題のあるノードと内容が入る
//   dataset_unreadable   … データセットの色表(labelmap.txt)が読めず、クラス数が分からない
// error-reason がなければ resume_precondition として扱う(古い ai-engine との互換)。
service TrainingService {
    rpc StartTraining(StartTrainingRequest) returns (StartTrainingResponse); // 単項
    rpc StreamProgress(StreamProgressRequest) returns (stream StreamProgressResponse); // サーバーストリーミング
    rpc StopTraining(StopTrainingRequest) returns (StopTrainingResponse); //単項
    // 学習を始めずに、モデルのグラフの構造と形を検証する(単項)。GPU は使わず、学習中でも呼べる。
    // 見つかった問題は status ではなく応答の violations で返す(問題があっても OK)。
    rpc ValidateModelGraph(ValidateModelGraphRequest) returns (ValidateModelGraphResponse);
}

// ---StartTrainingRequest---

// ---optimizer---

message AdamConfig  { reserved 1; double weight_decay = 2; double beta1 = 3; double beta2 = 4; double eps = 5; }
message AdamWConfig { reserved 1; double weight_decay = 2; double beta1 = 3; double beta2 = 4; }
message SGDConfig   { reserved 1; double weight_decay = 2; double momentum = 3; bool nesterov = 4; }

message OptimizerConfig {
    double learning_rate = 10;
    oneof config {
        AdamConfig adam = 1;
        AdamWConfig adam_w = 2;
        SGDConfig sgd = 3;
    }
}

// --lrScheduler--

message PolySchedulerConfig   {  double power = 1; }
message CosineSchedulerConfig {  double min_lr = 1; }
message StepSchedulerConfig   {  uint32 step_size = 1; double gamma = 2; } // step_size はエポック数
message NoneSchedulerConfig   {}

enum LearningRateUpdateInterval {
    LEARNING_RATE_UPDATE_INTERVAL_PER_BATCH = 0;
    LEARNING_RATE_UPDATE_INTERVAL_PER_EPOCH = 1;
}

message LearningRateSchedulerConfig {
    oneof config {
        NoneSchedulerConfig   none   = 1;
        PolySchedulerConfig   poly   = 2;
        CosineSchedulerConfig cosine = 3;
        StepSchedulerConfig   step   = 4;
    }
    LearningRateUpdateInterval update_interval = 5;
    uint32 warmup_epochs = 6; // 0 なら warmup しない
}


// ---loss---

message CrossEntropyConfig {}
message MseLossConfig {}
message DiceLossConfig {}
message FocalLossConfig { double gamma = 1; double alpha = 2; }
message ComboLossConfig { double alpha = 1; } // Cross Entropy 項の重み。(1-alpha) が Dice 項の重み。送る側が必ず値を埋める(未設定だと 0.0 になる)
message BoundaryLossConfig {}

// 並び順は C++ の LossConfig(std::variant)/ LossType と対応させる。
// numClasses / ignoreIndex はデータセット由来の値なのでここには持たない。
message LossConfig {
    oneof config {
        CrossEntropyConfig cross_entropy = 1;
        MseLossConfig mse = 2;
        DiceLossConfig dice = 3;
        FocalLossConfig focal = 4;
        ComboLossConfig combo = 5;
        BoundaryLossConfig boundary = 6;
    }
}

// ---Data---

// データセットの形式。どちらも VOC と同じディレクトリ構成(JPEGImages / ImageSets / SegmentationClass)を読む。
//   pascal_voc … 本家 PASCAL VOC。マスクは VOC のカラーマップ(21 クラス固定)。labelmap.txt は読まない
//   original   … 独自形式(CVAT の Segmentation mask 書き出しなど)。色とクラスの対応は labelmap.txt で決める
message PascalVocConfig { bool include_difficult = 1; }
message OriginalConfig {}
message ImageAnnotationConfig {
    oneof config {
        PascalVocConfig pascal_voc = 1;
        OriginalConfig original = 2;
    }
}

// マスク画像の色のうち、色表(pascal_voc は VOC のカラーマップ、original は labelmap.txt)にない色の扱い:
//   ignore_color_enabled = true  … ignore_color_r/g/b の色だけを ignore_index に変換する。それ以外の未知の色はエラー
//   ignore_color_enabled = false … 未知の色はすべてエラー(ignore_color_r/g/b は読まない)
// Pascal VOC の境界・difficult 領域(void)の色は 224,224,192。
message SegmentationSpec {
    uint32 ignore_index = 1;         // 必ず設定する、0〜255、既定値は 255
    bool ignore_color_enabled = 2;
    uint32 ignore_color_r = 3;       // 0〜255
    uint32 ignore_color_g = 4;       // 0〜255
    uint32 ignore_color_b = 5;       // 0〜255
}
message ObjectDetectionSpec {}
message ClassificationSpec  {}
message ImageTaskSpecs {
    oneof spec {
        SegmentationSpec segmentation = 1;
        ObjectDetectionSpec object_detection = 2;
        ClassificationSpec classification = 3;
    }
}

message ImageSpec {
    ImageAnnotationConfig annotation = 1;
    uint32 input_width = 2; // 1以上.既定値256
    uint32 input_height = 3; // 1以上.既定値256
    ImageTaskSpecs task_specs = 4;
}

message DataSpec { oneof spec { ImageSpec image = 1; } } //データのvariant

// 再現性のための乱数シード。0 も有効な値なので、uint64 を直接持たずメッセージで包んで「未指定」と区別する
// (proto3 の optional はシステムの protoc 3.12 では実験フラグが必要なため使わない)。
message Seed { uint64 value = 1; }

// ---merge---

message StartTrainingRequest {
    string model_name = 1;
    model.v1.ModelGraph model_graph= 2;
    OptimizerConfig optimizer = 3;
    LossConfig loss = 4;
    uint32 epoch = 5;
    uint32 batch = 6;
    string dataset_path = 7;
    string device = 8;
    DataSpec data_spec = 9;
    uint32 save_last_every = 10; // 0=毎エポック
    // 11 は旧 resume_from(任意のパスから再開する経路。廃止)。再開は resume と model_id で決める。
    // 別の意味で再利用しないように番号と名前を予約する。
    reserved 11;
    reserved "resume_from";
    Seed seed = 12; // 未設定(has_seed = false)なら乱数を固定しない
    string model_id = 13; // モデル保存用のモデルid
    bool resume = 14; // 再開するかしないか
    LearningRateSchedulerConfig lr_scheduler = 15;
}

message StartTrainingResponse {
    string job_id = 1;
    TrainingStatus status = 2;
}

message StopTrainingRequest {string job_id = 1;}
message StopTrainingResponse {
    TrainingStatus status = 1;
}

// ---StreamProgress---

message StreamProgressRequest {string job_id = 1;oneof start_position { uint32 after_epoch = 2; }}

message StreamProgressResponse{
    uint32 epoch = 1; // 終了したエポック数
    double train_loss = 2; // 学習時の損失
    double val_loss = 3; // バリデーション時の損失
    TrainingStatus status = 4; // IDLE / RUNNING / COMPLETED /FAILED / STOPPED
    oneof metrics{
        SegmentationMetrics segmentation = 5; // セグメンテーション時のメトリクス(mioU,pixel_acc, fw_iou, mean_class_accuracy, per_class_iou)
        ClassificationMetrics classification = 9; // クラス分類時のメトリクス(accuracy, macro_f1, per_class_accuracy)
    }
    uint64 epoch_elapsed_ms = 6; // 処理済みエポックにかかった時間
    uint64 total_elapsed_ms = 7; // 累計処理時間
    string error_message = 8; // status が FAILED のときの原因
    // このエポックの最後のバッチで使った学習率(Optimizer から読んだ値。スケジューラなしなら optimizer の設定値)。
    // 1 エポックも終わっていない(epoch = 0)ときは 0
    double learning_rate = 10;
}

message SegmentationMetrics{
    double pixel_acc = 1;
    double miou = 2;
    double fw_iou = 3;
    double mean_class_accuracy = 4;
    repeated double per_class_iou = 5;
}

message ClassificationMetrics{
    double accuracy = 1;
    double macro_f1 = 2;
    repeated double per_class_accuracy = 3;
}

enum TrainingStatus {
    TRAINING_STATUS_UNSPECIFIED = 0;
    TRAINING_STATUS_RUNNING = 1;
    TRAINING_STATUS_COMPLETED = 2;
    TRAINING_STATUS_FAILED = 3;
    TRAINING_STATUS_STOPPED = 4;
    TRAINING_STATUS_IDLE = 5;
}
// ---ValidateModelGraph---
// 学習開始前の整合性チェックで、Rust から呼ぶ(docs/issues/2026-11-26/学習設定の検証をRustに集める.md の段階 2)。
// 確認するのはグラフの構造(つなぎ方・閉路)と形(チャンネル数・H / W・出力チャンネル数 = クラス数)。
// 層のパラメータの値の範囲は Rust が先に確かめる。不正な値が届いたときは INVALID_ARGUMENT を返す。

message ValidateModelGraphRequest {
    model.v1.ModelGraph model_graph = 1;
    DataSpec data_spec = 2;   // 入力の形(input_width / input_height)、タスク、アノテーションの形式
    string dataset_path = 3;  // クラス数を求めるため(Original なら labelmap.txt を読む。読めなければ FAILED_PRECONDITION)
}

// 添字。0 も有効な値なので、Seed と同じくメッセージで包んで「該当なし」と区別する
message Index { uint32 value = 1; }

// グラフの問題 1 つ。場所は添字で示す(該当しないものは未設定)
message GraphViolation {
    Index node_index = 1;   // model_graph.nodes の添字
    Index input_index = 2;  // そのノードの inputs の添字(node_index があるときだけ)
    Index output_index = 3; // model_graph.outputs の添字
    string message = 4;     // 利用者に見せる説明(日本語)
}

message ValidateModelGraphResponse {
    repeated GraphViolation violations = 1; // 空なら問題なし
}
